<title>E1 Pilot Dossier — Westbrook Performance Analysis</title>
<style>
  /* ============================================================
     E1 PILOT DOSSIER
     Palette: marine ground + buoy-orange accent.
     Chart series use the validated categorical set
     (validated vs surfaces #FAFBFB light / #122730 dark).
     ============================================================ */
  :root {
    color-scheme: light;

    /* grounds & surfaces — neutrals biased toward petrol, not pure grey */
    --plane:        #E8EEEE;
    --surface:      #FAFBFB;
    --surface-2:    #FFFFFF;
    --surface-sunk: #DFE7E8;

    /* ink */
    --ink:          #0A1A20;
    --ink-2:        #46606A;
    --ink-muted:    #71888F;

    /* structure */
    --rule:         rgba(10, 26, 32, 0.13);
    --rule-soft:    rgba(10, 26, 32, 0.07);
    --ring:         rgba(10, 26, 32, 0.10);

    /* accent — the course buoy */
    --accent:       #D2551C;
    --accent-ink:   #8C3510;
    --accent-wash:  rgba(210, 85, 28, 0.10);

    /* status */
    --good:         #0B8A3C;
    --warn:         #B57500;
    --crit:         #C13A3A;
    --good-wash:    rgba(11, 138, 60, 0.11);
    --warn-wash:    rgba(181, 117, 0, 0.12);
    --crit-wash:    rgba(193, 58, 58, 0.11);

    /* chart series (validated light steps) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --s4: #eda100; --s5: #e87ba4; --s6: #008300;

    --grid:         #DDE5E6;

    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --rail: 232px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --plane:        #08141A;
      --surface:      #122730;
      --surface-2:    #17313C;
      --surface-sunk: #0D1F27;

      --ink:          #E9F1F2;
      --ink-2:        #A2B8C0;
      --ink-muted:    #7A939C;

      --rule:         rgba(233, 241, 242, 0.15);
      --rule-soft:    rgba(233, 241, 242, 0.08);
      --ring:         rgba(233, 241, 242, 0.12);

      --accent:       #F07A42;
      --accent-ink:   #F5A57C;
      --accent-wash:  rgba(240, 122, 66, 0.14);

      --good:         #3FBB6A;
      --warn:         #E0A32B;
      --crit:         #E86B6B;
      --good-wash:    rgba(63, 187, 106, 0.14);
      --warn-wash:    rgba(224, 163, 43, 0.14);
      --crit-wash:    rgba(232, 107, 107, 0.14);

      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --s4: #c98500; --s5: #d55181; --s6: #008300;

      --grid:         #21414E;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:        #08141A;
    --surface:      #122730;
    --surface-2:    #17313C;
    --surface-sunk: #0D1F27;

    --ink:          #E9F1F2;
    --ink-2:        #A2B8C0;
    --ink-muted:    #7A939C;

    --rule:         rgba(233, 241, 242, 0.15);
    --rule-soft:    rgba(233, 241, 242, 0.08);
    --ring:         rgba(233, 241, 242, 0.12);

    --accent:       #F07A42;
    --accent-ink:   #F5A57C;
    --accent-wash:  rgba(240, 122, 66, 0.14);

    --good:         #3FBB6A;
    --warn:         #E0A32B;
    --crit:         #E86B6B;
    --good-wash:    rgba(63, 187, 106, 0.14);
    --warn-wash:    rgba(224, 163, 43, 0.14);
    --crit-wash:    rgba(232, 107, 107, 0.14);

    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --s4: #c98500; --s5: #d55181; --s6: #008300;

    --grid:         #21414E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- shared type ---------- */
  .eyebrow {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  h1, h2, h3, h4 { text-wrap: balance; margin: 0; line-height: 1.15; }
  h2 { font-size: 25px; letter-spacing: -0.02em; font-weight: 680; }
  h3 { font-size: 16.5px; letter-spacing: -0.01em; font-weight: 660; }
  h4 { font-size: 13.5px; font-weight: 660; }
  p  { margin: 0; }

  a { color: var(--accent-ink); }

  /* ---------- masthead ---------- */
  .masthead {
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
    padding: 18px 26px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
  }
  /* the waterline: content flies above it */
  .masthead::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent) 22%, var(--accent) 62%, transparent);
    opacity: 0.55;
  }
  .masthead .mark {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--accent-ink);
    border: 1px solid var(--accent);
    padding: 4px 9px;
    border-radius: 2px;
  }
  .masthead h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.015em; }
  .masthead .sub { color: var(--ink-muted); font-size: 12.5px; margin-left: auto; font-family: var(--mono); }

  /* ---------- shell ---------- */
  .shell { display: flex; align-items: flex-start; gap: 0; }

  nav.rail {
    width: var(--rail);
    flex: 0 0 var(--rail);
    position: sticky;
    top: 0;
    padding: 26px 0 40px;
    border-right: 1px solid var(--rule);
    background: var(--surface);
    min-height: 100vh;
  }
  nav.rail .grp { padding: 0 14px; margin-bottom: 22px; }
  nav.rail .grp > .eyebrow { padding: 0 10px 8px; display: block; }
  nav.rail button {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 3px;
    padding: 8px 10px;
    font: inherit; font-size: 14px;
    color: var(--ink-2);
    cursor: pointer;
    position: relative;
  }
  nav.rail button:hover { background: var(--surface-sunk); color: var(--ink); }
  nav.rail button[aria-current="true"] {
    color: var(--ink); font-weight: 620;
    background: var(--accent-wash);
  }
  nav.rail button[aria-current="true"]::before {
    content: ""; position: absolute; left: -14px; top: 6px; bottom: 6px;
    width: 2px; background: var(--accent);
  }
  nav.rail button .tag {
    float: right; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-muted); font-weight: 500; letter-spacing: 0.04em;
  }

  main { flex: 1 1 auto; min-width: 0; padding: 34px 40px 90px; max-width: 1080px; }

  section[hidden] { display: none; }
  .view > header { margin-bottom: 26px; }
  .view > header h2 { margin: 6px 0 8px; }
  .view > header .lede { color: var(--ink-2); max-width: 68ch; font-size: 15.5px; }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--rule-soft);
    border-radius: 4px;
    padding: 20px 22px;
  }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(224px, 1fr)); gap: 14px; }

  /* ---------- stat tiles ---------- */
  .tile { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 4px; padding: 15px 17px; }
  .tile .k { display: block; margin-bottom: 7px; }
  .tile .v { font-family: var(--mono); font-size: 27px; font-weight: 600; letter-spacing: -0.02em; display: block; line-height: 1.1; }
  .tile .n { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; display: block; line-height: 1.45; }

  /* ---------- bar chart ---------- */
  .chart { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 4px; padding: 20px 22px; }
  .chart .ttl { font-size: 15px; font-weight: 640; margin-bottom: 3px; }
  .chart .cap { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 18px; }
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: 124px 1fr; align-items: center; gap: 12px; }
  .bar-row .lbl { font-family: var(--mono); font-size: 12px; color: var(--ink-2); text-align: right; letter-spacing: 0.02em; }
  .bar-track { position: relative; height: 26px; background: var(--surface-sunk); border-radius: 2px; overflow: hidden; }
  .bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: 0 4px 4px 0;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 9px;
    transition: width .55s cubic-bezier(.2,.7,.3,1);
  }
  .bar-fill .val { font-family: var(--mono); font-size: 12px; font-weight: 650; color: #fff; }
  .bar-row.dim .bar-fill { opacity: .48; }
  .bar-row .out { font-family: var(--mono); font-size: 12px; font-weight: 650; color: var(--ink); position: absolute; }

  /* ---------- rating pills ---------- */
  .rate {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 650;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 2px; white-space: nowrap;
  }
  .rate::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .rate.strength { color: var(--good); background: var(--good-wash); }
  .rate.risk     { color: var(--warn); background: var(--warn-wash); }
  .rate.weakness { color: var(--crit); background: var(--crit-wash); }
  .rate.neutral  { color: var(--ink-muted); background: var(--surface-sunk); }

  /* ---------- pilot roster ---------- */
  .roster { display: grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap: 14px; }
  .pilot-card {
    text-align: left; font: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--rule-soft);
    border-radius: 4px; padding: 18px 19px;
    display: flex; flex-direction: column; gap: 11px;
    transition: border-color .15s, transform .15s;
  }
  .pilot-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .pilot-card .nm { font-size: 19px; font-weight: 660; letter-spacing: -0.015em; }
  .pilot-card .tm { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-muted); }
  .pilot-card .st { color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
  .pilot-card .go { font-family: var(--mono); font-size: 11px; letter-spacing: 0.09em; color: var(--accent-ink); text-transform: uppercase; margin-top: auto; }

  /* ---------- pilot detail ---------- */
  .backlink {
    background: none; border: 0; font: inherit; font-family: var(--mono);
    font-size: 11.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--ink-muted); cursor: pointer; padding: 0; margin-bottom: 14px;
  }
  .backlink:hover { color: var(--accent-ink); }

  .trait { border-top: 1px solid var(--rule-soft); padding: 14px 0; }
  .trait:first-of-type { border-top: 0; }
  .trait .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 7px; }
  .trait .hd h4 { flex: 1 1 auto; }
  .quote {
    border-left: 2px solid var(--rule);
    padding: 2px 0 2px 13px;
    color: var(--ink-2);
    font-size: 13.5px;
    line-height: 1.55;
  }
  .quote cite { display: block; font-style: normal; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.07em; color: var(--ink-muted); margin-top: 6px; text-transform: uppercase; }

  /* ---------- discipline board ---------- */
  .disc { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 4px; padding: 18px 20px; }
  .disc h3 { margin-bottom: 4px; }
  .disc .q { color: var(--ink-muted); font-size: 12.5px; margin-bottom: 14px; }
  .rank { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule-soft); }
  .rank:first-of-type { border-top: 0; }
  .rank .pos {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    width: 20px; flex: none; padding-top: 3px;
    color: var(--ink-muted);
  }
  .rank.lead .pos { color: var(--accent); }
  .rank .body { flex: 1 1 auto; min-width: 0; }
  .rank .who { font-weight: 640; font-size: 14.5px; }
  .rank .who .team { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; color: var(--ink-muted); text-transform: uppercase; margin-left: 7px; font-weight: 500; }
  .rank .ev { color: var(--ink-2); font-size: 13px; margin-top: 3px; line-height: 1.5; }

  /* ---------- tables ---------- */
  .tw { overflow-x: auto; border: 1px solid var(--rule-soft); border-radius: 4px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; min-width: 460px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
  thead th {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink-muted); font-weight: 600;
    background: var(--surface-sunk); border-bottom: 1px solid var(--rule);
  }
  tbody tr:last-child td { border-bottom: 0; }
  td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  caption { caption-side: bottom; text-align: left; padding: 9px 14px; color: var(--ink-muted); font-size: 12px; }

  /* ---------- circuits ---------- */
  .circuit { background: var(--surface); border: 1px solid var(--rule-soft); border-radius: 4px; padding: 18px 20px; }
  .circuit .hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 3px; }
  .circuit .yr { font-family: var(--mono); font-size: 11px; color: var(--ink-muted); letter-spacing: 0.08em; }
  .chip {
    display: inline-block; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.09em; text-transform: uppercase; font-weight: 600;
    padding: 2px 7px; border-radius: 2px;
    background: var(--surface-sunk); color: var(--ink-2);
    border: 1px solid var(--rule-soft);
  }
  .chip.flat { color: var(--s1); border-color: color-mix(in srgb, var(--s1) 40%, transparent); background: color-mix(in srgb, var(--s1) 10%, transparent); }
  .chip.tech { color: var(--s2); border-color: color-mix(in srgb, var(--s2) 40%, transparent); background: color-mix(in srgb, var(--s2) 10%, transparent); }
  .chip.rough { color: var(--s5); border-color: color-mix(in srgb, var(--s5) 40%, transparent); background: color-mix(in srgb, var(--s5) 10%, transparent); }
  .kv { display: grid; grid-template-columns: 116px 1fr; gap: 5px 14px; margin-top: 12px; font-size: 13.5px; }
  .kv dt { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); padding-top: 3px; }
  .kv dd { margin: 0; color: var(--ink-2); }

  /* ---------- callout ---------- */
  .callout {
    border: 1px solid var(--accent);
    border-left-width: 2px;
    background: var(--accent-wash);
    border-radius: 3px;
    padding: 15px 18px;
  }
  .callout .eyebrow { color: var(--accent-ink); }
  .callout h3 { margin: 6px 0 7px; }
  .callout p { color: var(--ink-2); font-size: 14px; }

  .note { color: var(--ink-muted); font-size: 12.5px; line-height: 1.55; }

  /* ---------- legend ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule-soft); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  .legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }

  .toggle {
    background: none; border: 1px solid var(--rule); border-radius: 3px;
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-2); cursor: pointer;
    padding: 5px 10px; margin-top: 14px;
  }
  .toggle:hover { border-color: var(--accent); color: var(--accent-ink); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 860px) {
    .shell { display: block; }
    nav.rail {
      width: auto; position: static; min-height: 0;
      border-right: 0; border-bottom: 1px solid var(--rule);
      display: flex; gap: 0; overflow-x: auto; padding: 10px 12px;
    }
    nav.rail .grp { display: flex; gap: 4px; margin: 0; padding: 0 4px; }
    nav.rail .grp > .eyebrow { display: none; }
    nav.rail button { width: auto; white-space: nowrap; padding: 7px 12px; }
    nav.rail button[aria-current="true"]::before { display: none; }
    nav.rail button .tag { display: none; }
    main { padding: 24px 18px 70px; }
    .kv { grid-template-columns: 1fr; }
    .kv dd { margin-bottom: 8px; }
  }
</style>

<header class="masthead">
  <span class="mark">E1</span>
  <h1>Pilot Dossier &mdash; who is best at what</h1>
  <span class="sub">Assembled from Team Westbrook debriefs &amp; UIM E1 documents</span>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>

<script>
/* ==========================================================================
   DATA
   Every claim below is traceable to a source document. `src` names the file.
   Nothing here is invented: where the source is qualitative, the entry is
   qualitative; where it is a measured number, it is marked as measured.
   ========================================================================== */

const POINTS = [
  { pos: 1, pts: 38 }, { pos: 2, pts: 31 }, { pos: 3, pts: 25 },
  { pos: 4, pts: 20 }, { pos: 5, pts: 16 }, { pos: 6, pts: 12 },
  { pos: 7, pts: 9  }, { pos: 8, pts: 6  }, { pos: 9, pts: 3  }
];

const BONUS = [
  { what: "1st qualifying race", pts: "+3" },
  { what: "2nd qualifying race", pts: "+2" },
  { what: "3rd qualifying race", pts: "+1" },
  { what: "Fastest race lap in the final", pts: "+1" }
];

/* Standings as modelled in "E1 2025 podium chances" — the state going into
   the Lagos and Miami rounds. Only the six teams Tara modelled appear. */
const STANDINGS = [
  { team: "Brady",  full: "Team Brady",        pts: 135, hue: "--s1" },
  { team: "Rafa",   full: "Team Rafa",         pts: 134, hue: "--s2" },
  { team: "Aoki",   full: "Team Aoki",         pts: 125, hue: "--s3" },
  { team: "TBR",    full: "Team Blue Rising",  pts: 114, hue: "--s4" },
  { team: "WSTB",   full: "Westbrook Racing",  pts:  81, hue: "--s5" },
  { team: "Drogba", full: "Team Drogba",       pts:  79, hue: "--s6" }
];

/* The three end-of-season scenarios modelled in the same sheet. */
const SCENARIOS = [
  {
    name: "Westbrook out of it",
    gist: "Rivals score normally across Lagos. Even a Westbrook double win leaves them short of Aoki.",
    rows: [
      { team: "Aoki",  lagos: "2nd (31)",  miami: "—",       total: 156, win: true },
      { team: "WSTB",  lagos: "1st",       miami: "1st",     total: 165, win: false, note: "incl. 8 bonus pts" },
      { team: "Rafa",  lagos: "4th (20)",  miami: "—",       total: 154 },
      { team: "TBR",   lagos: "1st (38)",  miami: "—",       total: 152 },
      { team: "Brady", lagos: "5th (16)",  miami: "—",       total: 151 }
    ]
  },
  {
    name: "Alive but unlikely",
    gist: "Westbrook wins Lagos and Miami; rivals drop to mid-pack. Still only good enough to be in touch.",
    rows: [
      { team: "WSTB",  lagos: "1st → 123", miami: "→ 165",   total: 165, win: true },
      { team: "Brady", lagos: "5th → 151", miami: "no racing", total: 151 },
      { team: "Rafa",  lagos: "5th → 150", miami: "no racing", total: 150 },
      { team: "Aoki",  lagos: "3rd → 150", miami: "no racing", total: 150 },
      { team: "TBR",   lagos: "2nd → 145", miami: "8th (6)",  total: 151 }
    ]
  },
  {
    name: "Westbrook in front",
    gist: "The only modelled path to the title: win both rounds while every rival finishes 6th or worse.",
    rows: [
      { team: "WSTB",  lagos: "1st → 123", miami: "1st",     total: 165, win: true },
      { team: "Aoki",  lagos: "4th → 145", miami: "8th (6)", total: 151 },
      { team: "Brady", lagos: "6th → 147", miami: "9th (3)", total: 150 },
      { team: "Rafa",  lagos: "6th → 146", miami: "9th (3)", total: 149 },
      { team: "TBR",   lagos: "2nd → 145", miami: "9th (3)", total: 148 }
    ]
  }
];

const PILOTS = [
  {
    id: "sara",
    name: "Sara",
    team: "Westbrook Racing",

/* ---- Pilots ---- */
function viewPilots() {
  const cards = PILOTS.map(p => `
    <button class="pilot-card" data-pilot="${p.id}">

    </header>
    <div class="roster">${cards}</div>
    <p class="note" style="margin-top:20px">Every rating below is an assessment drawn from Team Westbrook&rsquo;s own debriefs and video analysis &mdash; not official timing data. Each one carries the sentence it came from.</p>

}

function viewPilotDetail(id) {
  const p = PILOTS.find(x => x.id === id);
  if (!p) return viewPilots();

  const traits = p.traits.map(t => `
    <div class="trait">
      <div class="hd">
        <h4>${esc(t.area)}</h4>
        <span class="rate ${t.rate}">${RATE_LABEL[t.rate]}</span>
      </div>
      <blockquote class="quote">${t.quote}<cite>${esc(t.src)}</cite></blockquote>
    </div>`).join("");

  const measured = p.measured ? `
    <div class="card">
      <h3>Measured</h3>
      <p class="note" style="margin:6px 0 12px">Recorded values, not assessment.</p>
      <div class="tw">
        <table><tbody>
          ${p.measured.map(m => `<tr><td>${esc(m.k)}</td><td class="n"><strong>${esc(m.v)}</strong></td></tr>`).join("")}
        </tbody></table>
      </div>
    </div>` : "";

  const fixes = p.fixes.length ? `
    <div class="card">
      <h3>Prescribed adjustments</h3>
      <p class="note" style="margin:6px 0 12px">Actions the team assigned to this pilot.</p>
      <ol style="margin:0; padding-left:20px; color:var(--ink-2); font-size:14px; line-height:1.65">
        ${p.fixes.map(f => `<li style="margin-bottom:7px">${f}</li>`).join("")}
      </ol>
    </div>` : "";

  const counts = ["strength", "risk", "weakness"].map(r => ({ r, n: p.traits.filter(t => t.rate === r).length })).filter(x => x.n);

  return `
  <div class="view">
    <button class="backlink" data-nav="pilots">&larr; All pilots</button>
    <header>
      <span class="eyebrow">${esc(p.team)}${p.teamLevel ? " · assessed at team level" : ""}</span>
      <h2>${esc(p.name)}</h2>
      <p class="lede">${esc(p.summary)}</p>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:14px">
        ${counts.map(c => `<span class="rate ${c.r}">${c.n} ${RATE_LABEL[c.r].toLowerCase()}${c.n > 1 ? (c.r === "weakness" ? "es" : "s") : ""}</span>`).join("")}
      </div>
    </header>

    <div class="stack">
      <div class="card">
        <span class="eyebrow">Driving signature</span>
        <h3 style="margin:6px 0 4px">${esc(p.style)}</h3>
        <p class="note">${esc(p.visual)}</p>
      </div>

      <div class="card">
        <h3 style="margin-bottom:6px">Assessment</h3>
        <p class="note" style="margin-bottom:8px">Each line is the team&rsquo;s own wording.</p>
        ${traits}
      </div>

      ${measured}
      ${fixes}
    </div>
  </div>`;
}

  return `
  <div class="view">
    <header>
      <span class="eyebrow">Comparison</span>

      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   ROUTER
   ========================================================================== */

const VIEWS = {
  season:    { label: "Championship", tag: "2025", render: viewSeason },
  pilots:    { label: "Pilots",       tag: "5",    render: viewPilots },
  best:      { label: "Best at what", tag: "6",    render: viewBest },
  circuits:  { label: "Circuits",     tag: "7",    render: viewCircuits },
  setup:     { label: "Setup",        tag: "",     render: viewSetup },
  protocols: { label: "Protocols",    tag: "4",    render: viewProtocols },
  sources:   { label: "Sources",      tag: "",     render: viewSources }
};

const NAV_GROUPS = [
  { title: "Results", items: ["season", "pilots", "best"] },
  { title: "Context", items: ["circuits", "setup", "protocols"] },
  { title: "Method",  items: ["sources"] }
];

let current = "season";

function buildRail() {
  const rail = document.getElementById("rail");
  rail.innerHTML = NAV_GROUPS.map(g => `
    <div class="grp">
      <span class="eyebrow">${g.title}</span>
      ${g.items.map(k => `<button data-nav="${k}">${VIEWS[k].label}${VIEWS[k].tag ? `<span class="tag">${VIEWS[k].tag}</span>` : ""}</button>`).join("")}
    </div>`).join("");
}

function go(key, pilotId) {
  const main = document.getElementById("main");
  if (pilotId) {
    main.innerHTML = viewPilotDetail(pilotId);
    current = "pilots";
  } else {
    main.innerHTML = VIEWS[key].render();
    current = key;
  }
  document.querySelectorAll("nav.rail button").forEach(b => {
    b.setAttribute("aria-current", b.dataset.nav === current ? "true" : "false");
  });
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { go(nav.dataset.nav); return; }
  const pc = e.target.closest("[data-pilot]");
  if (pc) { go("pilots", pc.dataset.pilot); }
});

buildRail();
go("season");
</script>
