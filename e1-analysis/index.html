/* ==========================================================================
   3. DATA ENGINE — parses pasted results and computes everything.
   ========================================================================== */

const SCHEMA = [
  { col: "event",    req: true,  desc: "Round name, e.g. Monaco",           alias: ["event","round","gp","race event","venue"] },
  { col: "session",  req: true,  desc: "Q1 Q2 Q3 Q4 GS1 GS2 RACEOFF PLACE FINAL1 FINAL2", alias: ["session","stage","phase","heat"] },
  { col: "team",     req: true,  desc: "Team name",                          alias: ["team","entrant"] },
  { col: "pilot",    req: true,  desc: "Pilot name",                         alias: ["pilot","driver","name"] },
  { col: "position", req: false, desc: "Finishing / classified position",    alias: ["position","pos","finish","result","rank","place"] },
  { col: "lane",     req: false, desc: "Starting lane",                      alias: ["lane","grid","start","startlane"] },
  { col: "bestLap",  req: false, desc: "Best lap — 1:23.456 or 83.456",      alias: ["bestlap","best lap","lap","laptime","lap time","time","best"] },
  { col: "s1",       req: false, desc: "Sector 1 time",                      alias: ["s1","sector1","sector 1"] },
  { col: "s2",       req: false, desc: "Sector 2 time",                      alias: ["s2","sector2","sector 2"] },
  { col: "s3",       req: false, desc: "Sector 3 time",                      alias: ["s3","sector3","sector 3"] },
  { col: "points",   req: false, desc: "Points scored (else derived)",       alias: ["points","pts","score"] },
  { col: "notes",    req: false, desc: "Free text",                          alias: ["notes","note","comment","comments"] }
];

const QUAL_SESSIONS = ["Q1","Q2","Q3","Q4"];
const RACE_SESSIONS = ["GS1","GS2","RACEOFF","PLACE","FINAL1","FINAL2"];

let DB = { rows: [], loadedAt: null };

function parseTime(v) {
  if (v === undefined || v === null) return null;
  let s = String(v).trim().replace(",", ".");
  if (!s || s === "-" || s === "—") return null;
  const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const min = m[1] ? parseInt(m[1], 10) : 0;
  const sec = parseFloat(m[2]);
  if (!isFinite(sec)) return null;
  return min * 60 + sec;
}
function fmtTime(t) {
  if (t === null || t === undefined || !isFinite(t)) return "—";
  const m = Math.floor(t / 60), s = t - m * 60;
  return m > 0 ? `${m}:${s.toFixed(3).padStart(6, "0")}` : s.toFixed(3);
}
function fmtGap(d) {
  if (d === null || !isFinite(d)) return "—";
  return (d > 0 ? "+" : "") + d.toFixed(3);
}
function normSession(v) {
  const s = String(v || "").toUpperCase().replace(/[\s_\-.]/g, "");
  if (/^Q[1-4]$/.test(s)) return s;
  if (/^(GS1|GROUPSTAGE1|GROUP1|G1)$/.test(s)) return "GS1";
  if (/^(GS2|GROUPSTAGE2|GROUP2|G2)$/.test(s)) return "GS2";
  if (/^(RACEOFF|RO)$/.test(s)) return "RACEOFF";
  if (/^(PLACE|PLACERACE|PR)$/.test(s)) return "PLACE";
  if (/^(FINAL1|F1)$/.test(s)) return "FINAL1";
  if (/^(FINAL2|F2|FINAL)$/.test(s)) return "FINAL2";
  return s || "?";
}

function parsePaste(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (lines.length < 2) throw new Error("Need a header row and at least one data row.");
  const tabs = (lines[0].match(/\t/g) || []).length;
  const commas = (lines[0].match(/,/g) || []).length;
  const semis = (lines[0].match(/;/g) || []).length;
  const delim = tabs >= Math.max(commas, semis) ? "\t" : (semis > commas ? ";" : ",");

  const split = (line) => {
    if (delim !== ",") return line.split(delim).map(c => c.trim());
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (c === "," && !q) { out.push(cur.trim()); cur = ""; }
      else cur += c;
    }
    out.push(cur.trim());
    return out;
  };

  const head = split(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim());
  const map = {};
  SCHEMA.forEach(f => {
    const i = head.findIndex(h => f.alias.includes(h));
    if (i >= 0) map[f.col] = i;
  });
  const missing = SCHEMA.filter(f => f.req && map[f.col] === undefined).map(f => f.col);
  if (missing.length) throw new Error(`Missing required column(s): ${missing.join(", ")}. Found headers: ${head.join(" | ")}`);

  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const c = split(lines[i]);
    const get = (k) => map[k] !== undefined ? (c[map[k]] ?? "").trim() : "";
    const pilot = get("pilot"), team = get("team");
    if (!pilot && !team) continue;
    const posRaw = get("position");
    const pos = posRaw === "" ? null : parseInt(posRaw.replace(/\D/g, ""), 10);
    const laneRaw = get("lane");
    const lane = laneRaw === "" ? null : parseInt(laneRaw.replace(/\D/g, ""), 10);
    const ptsRaw = get("points");
    rows.push({
      event: get("event") || "—",
      session: normSession(get("session")),
      team, pilot,
      position: isFinite(pos) ? pos : null,
      lane: isFinite(lane) ? lane : null,
      bestLap: parseTime(get("bestLap")),
      s1: parseTime(get("s1")), s2: parseTime(get("s2")), s3: parseTime(get("s3")),
      points: ptsRaw === "" ? null : (parseFloat(ptsRaw) || 0),
      notes: get("notes")
    });
  }
  if (!rows.length) throw new Error("No usable data rows found.");
  return rows;
}

/* ---- derived analytics ---- */

function events() { return [...new Set(DB.rows.map(r => r.event))]; }
function pilots() {
  const m = new Map();
  DB.rows.forEach(r => { if (r.pilot && !m.has(r.pilot)) m.set(r.pilot, r.team); });
  return [...m.entries()].map(([pilot, team]) => ({ pilot, team }));
}
function teams() { return [...new Set(DB.rows.map(r => r.team).filter(Boolean))]; }

/* Purple = outright fastest of that sector across the whole event. */
function purpleHolders(evt) {
  const rows = DB.rows.filter(r => r.event === evt);
  const out = {};
  ["s1","s2","s3","bestLap"].forEach(k => {
    const valid = rows.filter(r => r[k] !== null);
    if (!valid.length) { out[k] = null; return; }
    const best = valid.reduce((a, b) => (b[k] < a[k] ? b : a));
    out[k] = { pilot: best.pilot, team: best.team, t: best[k], session: best.session };
  });
  return out;
}

function pilotStats(name) {
  const rows = DB.rows.filter(r => r.pilot === name);
  const races = rows.filter(r => RACE_SESSIONS.includes(r.session));
  const quals = rows.filter(r => QUAL_SESSIONS.includes(r.session));
  const finals = rows.filter(r => r.session === "FINAL2");
  const scored = rows.filter(r => r.session === "FINAL2" || r.session === "PLACE");

  const finishPositions = races.filter(r => r.position !== null).map(r => r.position);
  const laps = rows.filter(r => r.bestLap !== null).map(r => r.bestLap);

  // consistency: spread between best and median lap
  let consistency = null, stdev = null;
  if (laps.length >= 3) {
    const sorted = [...laps].sort((a, b) => a - b);
    const med = sorted[Math.floor(sorted.length / 2)];
    consistency = med - sorted[0];
    const mean = laps.reduce((a, b) => a + b, 0) / laps.length;
    stdev = Math.sqrt(laps.reduce((a, b) => a + (b - mean) ** 2, 0) / laps.length);
  }

  // racecraft: positions gained vs starting lane
  const gainRows = races.filter(r => r.position !== null && r.lane !== null);
  const netGain = gainRows.length ? gainRows.reduce((a, r) => a + (r.lane - r.position), 0) : null;

  // purple sectors across all events
  let purples = 0, fastestLaps = 0;
  events().forEach(e => {
    const p = purpleHolders(e);
    ["s1","s2","s3"].forEach(k => { if (p[k] && p[k].pilot === name) purples++; });
    const rd = DB.rows.filter(r => r.event === e && RACE_SESSIONS.includes(r.session) && r.bestLap !== null);
    if (rd.length) {
      const best = rd.reduce((a, b) => (b.bestLap < a.bestLap ? b : a));
      if (best.pilot === name) fastestLaps++;
    }
  });

  // qualifying: deepest stage reached, best qualy position
  const deepest = QUAL_SESSIONS.filter(s => quals.some(q => q.session === s)).pop() || null;
  const q4 = quals.filter(q => q.session === "Q4" && q.position !== null).map(q => q.position);

  const totalPts = scored.reduce((a, r) => a + (r.points !== null ? r.points : (r.position && PTS_S3[r.position] ? PTS_S3[r.position] : 0)), 0);

  return {
    pilot: name, team: (rows[0] || {}).team || "—",
    sessions: rows.length, races: races.length, quals: quals.length,
    wins: finals.filter(r => r.position === 1).length,
    podiums: finals.filter(r => r.position !== null && r.position <= 3).length,
    bestFinish: finishPositions.length ? Math.min(...finishPositions) : null,
    avgFinish: finishPositions.length ? finishPositions.reduce((a, b) => a + b, 0) / finishPositions.length : null,
    bestLap: laps.length ? Math.min(...laps) : null,
    consistency, stdev, netGain, gainSamples: gainRows.length,
    purples, fastestLaps, deepestQ: deepest,
    bestQ4: q4.length ? Math.min(...q4) : null,
    points: totalPts,
    rows
  };
}

function allStats() { return pilots().map(p => pilotStats(p.pilot)); }

function save() {
  try { localStorage.setItem("e1scout", JSON.stringify(DB)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem("e1scout");
    if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.rows)) DB = d; }
  } catch (e) {}
}

}

/* ---- Qualifying ---- */
function viewQualifying() {
  const data = hasData() ? (() => {
    const evs = events();
    return evs.map(e => {
      const rows = DB.rows.filter(r => r.event === e && QUAL_SESSIONS.includes(r.session));
      if (!rows.length) return "";
      const byStage = QUAL_SESSIONS.map(q => {
        const rs = rows.filter(r => r.session === q).sort((a, b) => (a.position ?? 99) - (b.position ?? 99));
        if (!rs.length) return "";
        const best = rs.filter(r => r.bestLap !== null).map(r => r.bestLap);
        const pole = best.length ? Math.min(...best) : null;
        return `
        <div class="card">
          <h3>${esc(e)} &mdash; ${q}</h3>
          <div class="tw" style="margin-top:12px">
            <table>
              <thead><tr><th class="n">Pos</th><th>Pilot</th><th>Team</th><th class="n">Best lap</th><th class="n">Gap</th></tr></thead>
              <tbody>${rs.map(r => `
                <tr${(r.team || "").toLowerCase().includes(MY_TEAM.toLowerCase()) ? ' class="me"' : ""}>
                  <td class="n">${r.position ?? "—"}</td>
                  <td><strong>${esc(r.pilot)}</strong></td>
                  <td>${esc(r.team)}</td>
                  <td class="n">${fmtTime(r.bestLap)}</td>
                  <td class="n">${r.bestLap !== null && pole !== null ? (r.bestLap === pole ? "—" : fmtGap(r.bestLap - pole)) : "—"}</td>
                </tr>`).join("")}</tbody>
            </table>
          </div>
        </div>`;
      }).join("");
      return byStage;
    }).join("");
  })() : emptyState("Qualifying analysis");

  return `
  <div class="view">
    <header>
      <span class="eyebrow">Race day &minus;1</span>
      <h2>Qualifying</h2>
      <p class="lede">Four stages, two eliminations each after Q1. Q4 sets the race-day seeding and pays 3, 2 and 1 points to its top three.</p>
    </header>
    <div class="stack">
      <div class="card">
        <h3 style="margin-bottom:14px">The elimination ladder</h3>
        <div class="flow">
          ${QUALI.map(q => `
            <div class="stage">
              <span class="sn">${q.s}</span>
              <div class="sb">
                <h4>${esc(q.who)}</h4>
                <p>${q.detail}</p>
                <span class="cut">${esc(q.cut)}</span>
              </div>
            </div>`).join("")}
        </div>
      </div>
      <div class="callout">
        <span class="eyebrow">The tactical consequence</span>
        <h3>Q1 is a team average &mdash; every later stage is a single pilot</h3>
        <p>Q1 ranks you on the <strong>average of both pilots&rsquo; best laps</strong>, so a weak second pilot eliminates a strong first one before the format ever tests them individually. From Q2 onward only one declared pilot runs, and the rotation rule forces you to alternate for every subsequent session &mdash; a cancelled session still burns that pilot&rsquo;s turn. So your Q2 declaration is really a bet on who you want available in Q4, two stages later.</p>
      </div>
      ${data}
    </div>
  </div>`;
}

/* ---- Pace & purple ---- */
function viewPace() {
  if (!hasData()) {
    return `
    <div class="view">
      <header>
        <span class="eyebrow">Speed</span>
        <h2>Pace, purple sectors &amp; consistency</h2>
        <p class="lede">Outright pace, sector-by-sector strength, and how repeatable each pilot is lap to lap.</p>
      </header>
      <div class="stack">
        <div class="callout">
          <span class="eyebrow">Worth knowing before you build this</span>
          <h3>E1 pays for the fastest standard lap &mdash; not for sectors</h3>
          <p>The Season 3 sporting format awards <strong>1 point for the fastest standard lap on race day</strong>, and nothing for sectors. Purple sectors are still the sharper diagnostic &mdash; they tell you <em>where</em> on the circuit a rival takes their time, which a single lap time hides &mdash; but no championship points ride on them. The format also voids the fastest-lap point entirely if a misplaced or drifting mark interrupted the racing line in any session, so check for that before you count it.</p>
        </div>
        ${emptyState("Pace analysis")}
      </div>
    </div>`;
  }

  const st = allStats().filter(s => s.bestLap !== null).sort((a, b) => a.bestLap - b.bestLap);
  const fastest = st.length ? st[0].bestLap : null;
  const consist = allStats().filter(s => s.consistency !== null).sort((a, b) => a.consistency - b.consistency);

  const purpleTables = events().map(e => {
    const p = purpleHolders(e);
    return `
    <div class="card">
      <h3>${esc(e)} &mdash; purple holders</h3>
      <div class="tw" style="margin-top:12px">
        <table>
          <thead><tr><th>Segment</th><th>Pilot</th><th>Team</th><th class="n">Time</th><th>Set in</th></tr></thead>
          <tbody>
            ${["s1","s2","s3","bestLap"].map(k => {
              const h = p[k];
              const lbl = k === "bestLap" ? "Full lap" : "Sector " + k[1];
              if (!h) return `<tr><td>${lbl}</td><td colspan="4" class="note">no data</td></tr>`;
              return `<tr${(h.team||"").toLowerCase().includes(MY_TEAM.toLowerCase()) ? ' class="me"' : ""}>
                <td><span class="rate purple">${lbl}</span></td>
                <td><strong>${esc(h.pilot)}</strong></td><td>${esc(h.team)}</td>
                <td class="n">${fmtTime(h.t)}</td><td><span class="chip">${esc(h.session)}</span></td></tr>`;
            }).join("")}
          </tbody>
        </table>
        <p class="note" style="padding:10px 14px">A theoretical best lap is the sum of the three purple sectors. If no single pilot holds all three, nobody has yet driven the lap the circuit allows.</p>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="view">
    <header>
      <span class="eyebrow">Speed</span>
      <h2>Pace, purple sectors &amp; consistency</h2>
      <p class="lede">Outright pace tells you who is fast. Sector splits tell you where. Consistency tells you whether they can do it twice &mdash; which, in a format with two non-consecutive qualifying attempts, is what actually decides the grid.</p>
    </header>
    <div class="stack">
      <div class="card">
        <h3>Outright pace</h3>
        <p class="note" style="margin:5px 0 16px">Best lap set in any session. Gap is to the fastest pilot in the loaded data.</p>
        <div class="tw">
          <table>
            <thead><tr><th class="n">#</th><th>Pilot</th><th>Team</th><th class="n">Best lap</th><th class="n">Gap</th><th class="n">Fastest laps</th></tr></thead>
            <tbody>${st.map((s, i) => `
              <tr${(s.team||"").toLowerCase().includes(MY_TEAM.toLowerCase()) ? ' class="me"' : ""}>
                <td class="n">${i + 1}</td><td><strong>${esc(s.pilot)}</strong></td><td>${esc(s.team)}</td>
                <td class="n">${fmtTime(s.bestLap)}</td>
                <td class="n">${i === 0 ? "—" : fmtGap(s.bestLap - fastest)}</td>
                <td class="n">${s.fastestLaps}</td>
              </tr>`).join("")}</tbody>
          </table>
        </div>
      </div>

      ${consist.length ? `
      <div class="card">
        <h3>Consistency</h3>
        <p class="note" style="margin:5px 0 16px">Median lap minus best lap &mdash; how much a pilot gives away on a normal lap versus their peak. Lower is more repeatable. Standard deviation shown alongside.</p>
        <div class="tw">
          <table>
            <thead><tr><th class="n">#</th><th>Pilot</th><th>Team</th><th class="n">Median − best</th><th class="n">σ</th><th class="n">Laps</th></tr></thead>
            <tbody>${consist.map((s, i) => `
              <tr${(s.team||"").toLowerCase().includes(MY_TEAM.toLowerCase()) ? ' class="me"' : ""}>
                <td class="n">${i + 1}</td><td><strong>${esc(s.pilot)}</strong></td><td>${esc(s.team)}</td>
                <td class="n">+${s.consistency.toFixed(3)}</td>
                <td class="n">${s.stdev.toFixed(3)}</td>
                <td class="n">${s.rows.filter(r => r.bestLap !== null).length}</td>
              </tr>`).join("")}</tbody>
          </table>
        </div>
      </div>` : ""}

      ${purpleTables}
    </div>
  </div>`;
}

/* ---- Racecraft ---- */
function viewRacecraft() {
  const data = hasData() ? (() => {

    if (!st.length) return `<div class="card"><p class="note">Your data has no rows with both a starting lane and a finishing position, so positions gained cannot be computed. Add a <code>lane</code> column to unlock this.</p></div>`;
    return `
    <div class="card">
      <h3>Positions gained against starting lane</h3>
      <p class="note" style="margin:5px 0 16px">Lane minus finishing position, summed across every race. Positive means they make places; negative means they lose them. Lane order is mandated by seed, so this isolates racecraft from qualifying.</p>
      <div class="tw">
        <table>
          <thead><tr><th class="n">#</th><th>Pilot</th><th>Team</th><th class="n">Net</th><th class="n">Races</th><th class="n">Avg finish</th></tr></thead>
          <tbody>${st.map((s, i) => `
            <tr${(s.team||"").toLowerCase().includes(MY_TEAM.toLowerCase()) ? ' class="me"' : ""}>
              <td class="n">${i + 1}</td><td><strong>${esc(s.pilot)}</strong></td><td>${esc(s.team)}</td>
              <td class="n"><strong>${s.netGain > 0 ? "+" : ""}${s.netGain}</strong></td>

              <td class="n">${s.avgFinish !== null ? s.avgFinish.toFixed(2) : "—"}</td>
            </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`;

  return `
  <div class="view">
    <header>
      <span class="eyebrow">Race day</span>
      <h2>Racecraft</h2>
      <p class="lede">How pilots actually race &mdash; what they do with the lane they are given, when they take the mandatory laps, and the documented failure modes worth watching for.</p>
    </header>
    <div class="stack">
      <div class="card">
        <h3 style="margin-bottom:14px">Race-day progression</h3>
        <div class="flow">
          ${RACEDAY.map(r => `
            <div class="stage">
              <span class="sn">${esc(r.s.split(" ")[0])}</span>
              <div class="sb">
                <h4>${esc(r.who)}</h4>
                <p>${r.detail}</p>
                <span class="cut">${esc(r.cut)}</span>
              </div>
            </div>`).join("")}
        </div>
      </div>

      <div class="callout">
        <span class="eyebrow">The mandatory laps</span>
        <h3>One long lap, one short lap, neither on lap 1</h3>
        <p>Blue Rising is the only rival with this measured: at Lagos they took the long lap on <strong>lap 2 of 6</strong> from second place, absorbing the roughly 12-second penalty while the pack was still bunched, and came out 3.6 seconds off the leader having been 7.9&ndash;9.3 seconds behind. Their short lap averaged about &minus;10 seconds &mdash; so the net cost of the pair is small and the <em>timing</em> is the whole decision.</p>

        ${FIELD_NOTES.map(n => `
          <div class="trait">
            <div class="hd"><h4>${esc(n.t)}</h4></div>

            <p class="note" style="margin-top:8px">${esc(n.src)}</p>
          </div>`).join("")}
      </div>

  </div>`;
}

      </div>
      <div class="card">
        <h3 style="margin-bottom:6px">Limits</h3>
        ${GAPS.map(g => `
          <div class="trait">
            <div class="hd"><h4>${esc(g.t)}</h4></div>
            <p style="color:var(--ink-2); font-size:13.5px">${esc(g.d)}</p>
          </div>`).join("")}
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   5. ROUTER
   ========================================================================== */

const VIEWS = {
  paddock:   { label: "Paddock",    render: viewPaddock },
  pilots:    { label: "Pilots",     render: viewPilots },
  qualifying:{ label: "Qualifying", render: viewQualifying },
  pace:      { label: "Pace & purple", render: viewPace },
  racecraft: { label: "Racecraft",  render: viewRacecraft },
  intel:     { label: "Rival intel", render: viewIntel },
  format:    { label: "S3 format",  render: viewFormat },
  import:    { label: "Load data",  render: viewImport },
  sources:   { label: "Sources",    render: viewSources }
};

const NAV_GROUPS = [
  { title: "Performance", items: ["paddock", "pilots", "qualifying", "pace", "racecraft"] },
  { title: "Scouting",    items: ["intel", "format"] },
  { title: "Data",        items: ["import", "sources"] }
];

let current = "paddock";

function buildRail() {
  document.getElementById("rail").innerHTML = NAV_GROUPS.map(g => `
    <div class="grp">
      <span class="eyebrow">${g.title}</span>
      ${g.items.map(k => `<button data-nav="${k}">${VIEWS[k].label}${k === "intel" ? `<span class="tag">${INTEL.length}</span>` : ""}${k === "import" && hasData() ? `<span class="tag">${DB.rows.length}</span>` : ""}</button>`).join("")}
    </div>`).join("");
}

function updateState() {
  document.getElementById("dataState").textContent = hasData()
    ? `${DB.rows.length} sessions · ${pilots().length} pilots · ${events().length} event(s)`
    : "No timing data loaded";
}

function go(key, opts = {}) {
  const main = document.getElementById("main");
  if (opts.pilot) { main.innerHTML = viewPilotDetail(opts.pilot); current = "pilots"; }
  else if (opts.intel) { main.innerHTML = viewIntelDetail(opts.intel); current = "intel"; }
  else { main.innerHTML = VIEWS[key].render(); current = key; }
  document.querySelectorAll("nav.rail button").forEach(b => b.setAttribute("aria-current", b.dataset.nav === current ? "true" : "false"));
  window.scrollTo({ top: 0, behavior: "instant" });
}

document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { go(nav.dataset.nav); return; }
  const pc = e.target.closest("[data-pilot]");
  if (pc) { go("pilots", { pilot: pc.dataset.pilot }); return; }
  const ic = e.target.closest("[data-intel]");
  if (ic) { go("intel", { intel: ic.dataset.intel }); return; }

  if (e.target.id === "doImport") {
    const msg = document.getElementById("importMsg");
    try {
      const rows = parsePaste(document.getElementById("paste").value);
      DB = { rows, loadedAt: new Date().toISOString() };
      save(); buildRail(); updateState();
      msg.style.color = "var(--good)";
      msg.textContent = `Loaded ${rows.length} sessions · ${pilots().length} pilots · ${events().length} event(s). Open Paddock, Pace or Racecraft to see it.`;
    } catch (err) {
      msg.style.color = "var(--crit)";
      msg.textContent = err.message;
    }
    return;
  }
  if (e.target.id === "doTemplate") {
    const header = SCHEMA.map(f => f.col).join("\t");
    const ta = document.getElementById("paste");
    ta.value = header + "\n";
    ta.focus();
    const msg = document.getElementById("importMsg");
    msg.style.color = "var(--ink-muted)";
    msg.textContent = "Template header inserted. Paste your rows beneath it, or match these names in Smartsheet and copy the whole block.";
    return;
  }
  if (e.target.id === "doClear") {
    DB = { rows: [], loadedAt: null };
    save(); buildRail(); updateState(); go("import");
    return;
  }
});

load();
buildRail();
updateState();
go("paddock");
</script>
